<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지출결의서</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f3f4f6;
      --paper: #ffffff;
      --line: #d9d9de;
      --line-dark: #1f2937;
      --text: #111827;
      --muted: #6b7280;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .paper {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.06);
      padding: 28px;
    }

    .title {
      margin: 0;
      text-align: center;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 0.22em;
      line-height: 1.15;
    }

    .section { margin-top: 34px; }
    .section-title {
      margin: 0 0 18px;
      padding-bottom: 10px;
      font-size: 30px;
      font-weight: 800;
      border-bottom: 4px solid var(--line-dark);
      letter-spacing: -0.02em;
    }

    .basic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }
    .field-span-2 { grid-column: span 2; }
    .label { font-size: 15px; font-weight: 700; color: var(--text); }
    .help { font-size: 12px; color: var(--muted); margin-top: -2px; }
    
    .required { color: red; margin-left: 3px; font-weight: bold; }

    input, select, textarea, button {
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }

    input, select, textarea {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.06);
    }

    input[readonly] { background: #f9fafb; color: #374151; cursor: default; }
    textarea { min-height: 150px; resize: vertical; }
    
    input[type="file"] { padding: 12px 16px; font-size: 14px; cursor: pointer; }

    .detail-rows { display: flex; flex-direction: column; gap: 16px; }
    .detail-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: #fcfcfd;
    }

    .detail-card-title { margin: 0 0 14px; font-size: 16px; font-weight: 800; color: #111827; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .total-box {
      margin-top: 18px;
      border: 1px solid var(--line);
      background: #f9fafb;
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .total-label { font-size: 16px; font-weight: 700; }
    .total-value { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }

    .submit-area { margin-top: 30px; }
    .submit-btn {
      width: 100%;
      min-height: 56px;
      border: none;
      border-radius: 16px;
      background: #111827;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .submit-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .guide { margin-top: 8px; text-align: center; font-size: 12px; color: var(--muted); }

    @media (max-width: 900px) {
      .paper { padding: 22px 16px; border-radius: 20px; }
      .title { font-size: 34px; letter-spacing: 0.14em; }
      .section { margin-top: 26px; }
      .section-title { font-size: 22px; padding-bottom: 8px; border-bottom-width: 3px; }
      .basic-grid { grid-template-columns: 1fr; }
      .field-span-2 { grid-column: span 1; }
      .detail-grid { grid-template-columns: 1fr 1fr; }
      .detail-grid .field:last-child { grid-column: span 2; }
      .total-box { flex-direction: column; align-items: flex-start; }
      .total-value { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="paper">
      <h1 class="title">지출결의서</h1>

      <form id="expenseForm">
        <div class="section">
          <h2 class="section-title">기본 정보</h2>

          <div class="basic-grid">
            <div class="field">
              <label class="label" for="writeDate">작성일</label>
              <input type="date" id="writeDate" name="작성일" readonly>
              <div class="help">작성일은 접속 당일로 자동 입력됩니다.</div>
            </div>

            <div class="field">
              <label class="label" for="payDate">지출일 <span class="required">*</span></label>
              <input type="date" id="payDate" name="지출일" required>
            </div>

            <div class="field">
              <label class="label" for="applicant">신청자 <span class="required">*</span></label>
              <input type="text" id="applicant" name="신청자" required>
            </div>

            <div class="field">
              <label class="label" for="department">소속 <span class="required">*</span></label>
              <select id="department" name="소속" required>
                <option value="">선택</option>
                <option value="한라에스앤에프">한라에스앤에프</option>
                <option value="제주에스에프">제주에스에프</option>
              </select>
            </div>

            <div class="field">
              <label class="label" for="position">직급 <span class="required">*</span></label>
              <input type="text" id="position" name="직급" required>
            </div>

            <div class="field">
              <label class="label" for="manager">담당자</label>
              <input type="text" id="manager" name="담당자">
            </div>

            <div class="field field-span-2">
              <label class="label" for="title">건명 <span class="required">*</span></label>
              <input type="text" id="title" name="건명" required>
            </div>

            <div class="field">
              <label class="label" for="corporateCard">법인카드 사용 여부 <span class="required">*</span></label>
              <select id="corporateCard" name="법인카드사용여부" required>
                <option value="">선택</option>
                <option value="유">유</option>
                <option value="무">무</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">지출 내역</h2>

          <div class="detail-rows">
            <div class="detail-card">
              <h3 class="detail-card-title">1행 (필수)</h3>
              <div class="detail-grid">
                <div class="field">
                  <label class="label" for="vendor1">사용처 <span class="required">*</span></label>
                  <input type="text" id="vendor1" name="사용처1" required>
                </div>
                <div class="field">
                  <label class="label" for="description1">적요 <span class="required">*</span></label>
                  <input type="text" id="description1" name="적요1" required>
                </div>
                <div class="field">
                  <label class="label" for="amount1">금액 <span class="required">*</span></label>
                  <input type="number" id="amount1" name="금액1" class="amount" min="0" step="1" inputmode="numeric" required>
                </div>
                <div class="field">
                  <label class="label" for="accountHolder1">은행명</label>
                  <input type="text" id="accountHolder1" name="은행명1">
                </div>
                <div class="field">
                  <label class="label" for="accountNumber1">계좌번호</label>
                  <input type="text" id="accountNumber1" name="계좌번호1">
                </div>
              </div>
            </div>
            <div class="detail-card">
              <h3 class="detail-card-title">2행 (선택)</h3>
              <div class="detail-grid">
                <div class="field"><label class="label">사용처</label><input type="text" name="사용처2"></div>
                <div class="field"><label class="label">적요</label><input type="text" name="적요2"></div>
                <div class="field"><label class="label">금액</label><input type="number" name="금액2" class="amount"></div>
                <div class="field"><label class="label">은행명</label><input type="text" name="은행명2"></div>
                <div class="field"><label class="label">계좌번호</label><input type="text" name="계좌번호2"></div>
              </div>
            </div>
            <div class="detail-card">
              <h3 class="detail-card-title">3행 (선택)</h3>
              <div class="detail-grid">
                <div class="field"><label class="label">사용처</label><input type="text" name="사용처3"></div>
                <div class="field"><label class="label">적요</label><input type="text" name="적요3"></div>
                <div class="field"><label class="label">금액</label><input type="number" name="금액3" class="amount"></div>
                <div class="field"><label class="label">은행명</label><input type="text" name="은행명3"></div>
                <div class="field"><label class="label">계좌번호</label><input type="text" name="계좌번호3"></div>
              </div>
            </div>
          </div>

          <div class="total-box">
            <div class="total-label">합계 금액</div>
            <div class="total-value">₩ <span id="totalAmount">0</span></div>
            <input type="hidden" id="hiddenTotalAmount" name="총금액" value="0">
          </div>
        </div>

        <div class="section">
          <h2 class="section-title">비고 및 영수증</h2>
          <div class="field">
            <label class="label" for="etc">비고</label>
            <textarea name="비고" id="etc" placeholder="필요한 내용을 입력해 주세요."></textarea>
          </div>
          
          <div class="field" style="margin-top: 16px;">
            <label class="label" for="receiptFile">영수증 파일 첨부 (이미지 또는 PDF)</label>
            <input type="file" id="receiptFile" accept="image/*,application/pdf">
            <div class="help">최대 3MB 이하의 파일만 업로드 가능합니다.</div>
          </div>
        </div>

        <div class="submit-area">
          <button type="submit" class="submit-btn" id="submitBtn">결의서 제출</button>
          <div class="guide" id="guideText">제출 후 접수 완료 알림이 뜰 때까지 기다려주세요.</div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const amountInputs = document.querySelectorAll(".amount");
    const totalAmountEl = document.getElementById("totalAmount");
    const hiddenTotalAmountEl = document.getElementById("hiddenTotalAmount");
    const writeDateInput = document.getElementById("writeDate");

    function getTodayLocalDate() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split("T")[0];
    }

    function setTodayWriteDate() {
      writeDateInput.value = getTodayLocalDate();
    }

    function formatNumber(num) {
      return Number(num || 0).toLocaleString("ko-KR");
    }

    function updateTotal() {
      let total = 0;
      amountInputs.forEach((input) => {
        total += Number(input.value || 0);
      });
      totalAmountEl.textContent = formatNumber(total);
      hiddenTotalAmountEl.value = total;
    }

    amountInputs.forEach((input) => {
      input.addEventListener("input", updateTotal);
    });

    setTodayWriteDate();
    updateTotal();

    // [중요] 새로 배포하신 URL을 변수에 적용했습니다.
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxdYzruJgOAX-0rYcBH2wN6ZEWeJXw1bvarnChdtlWxKbApoKJDVhTaczCKkknR8CyJOw/exec';

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault(); 
      
      const fileInput = document.getElementById('receiptFile');
      if (fileInput.files.length > 0) {
        const fileSize = fileInput.files[0].size / 1024 / 1024;
        if (fileSize > 3) {
          alert('❌ 파일 용량이 너무 큽니다. 3MB 이하의 파일만 첨부해 주세요.');
          return;
        }
      }

      const submitBtn = document.getElementById('submitBtn');
      const guideText = document.getElementById('guideText');
      submitBtn.disabled = true;
      submitBtn.textContent = '처리 중입니다... 잠시만 기다려주세요';
      guideText.textContent = '영수증 첨부 시 수 초가 소요될 수 있습니다.';

      const formData = new FormData(this);
      const data = {};
      formData.forEach((value, key) => { data[key] = value; });

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          data.fileData = e.target.result.split(',')[1]; 
          data.fileName = file.name;
          data.fileMimeType = file.type;
          sendDataToGoogle(data);
        };
        reader.readAsDataURL(file);
      } else {
        sendDataToGoogle(data);
      }
    });

    function sendDataToGoogle(dataPayload) {
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, 
        body: JSON.stringify(dataPayload)
      })
      .then(response => response.json())
      .then(result => {
        if(result.status === 'success') {
          document.body.innerHTML = `
            <div class="page" style="text-align: center; margin-top: 10vh;">
              <div class="paper" style="padding: 60px 20px;">
                <h2 style="font-size: 34px; color: #111827; margin-bottom: 20px;">✅ 제출 완료</h2>
                <p style="font-size: 18px; color: #6b7280;">접수번호: <b style="color: #111827;">` + result.receiptNo + `</b></p>
                <p style="font-size: 16px; color: #6b7280; margin-bottom: 40px; line-height: 1.6;">
                  지출결의서가 정상적으로 접수되었습니다.<br>
                  관리자에게 확인 이메일이 발송되었습니다.
                </p>
                <button onclick="window.location.reload()" style="background: #111827; color: #fff; border: none; padding: 16px 32px; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s;">새 결의서 작성하기</button>
              </div>
            </div>
          `;
          window.scrollTo(0, 0);
        } else {
          alert('❌ 서버 오류 발생: ' + result.message);
          resetButton();
        }
      })
      .catch(error => {
        alert('❌ 통신 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.');
        resetButton();
      });
    }

    function resetButton() {
      const submitBtn = document.getElementById('submitBtn');
      const guideText = document.getElementById('guideText');
      submitBtn.disabled = false;
      submitBtn.textContent = '결의서 제출';
      guideText.textContent = '제출 후 접수 완료 알림이 뜰 때까지 기다려주세요.';
    }
  </script>
</body>
</html>
